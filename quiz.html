<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Me-time Quiz</title>

    <meta name="theme-color" content="#673ab8">
	<link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
	<link rel="icon" type="image/png" href="https://www.citypng.com/public/uploads/preview/musical-note-black-icon-symbol-transparent-png-7017516950335268jb4vzed5z.png">
	<!-- <link rel="icon" type="image/png" href="/assets/icons/favicon-16x16.png" sizes="16x16"> -->

    <link rel="stylesheet" href="design_quiz.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <p><a href="index.html">Home</a></p>

    </header>

    <section class="body" >

        <!-- title -->
        <p>A LOT OF ME-TIME</p>

        <p id="ask_mood">How was your day?</p>


    <div class="button">

    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck1" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck1">Sad</label>
    </div>

<div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck2" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck2">Anxious</label>
    </div>

    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck3" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck3">Worried</label>
    </div>

    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck4" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck4">Angry</label>
    </div>

    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck5" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck5">Excited</label>
    </div>

    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck6" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck6">Happy</label>
    </div>

    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck7" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck7">Proud</label>
    </div>

    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
  <input type="checkbox" class="btn-check" id="btncheck8" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck8">Calm</label>

    </div>
    </div>

    <div class="enter_btn">
        <button type="button" id="enter_btn" class="btn btn-primary"
        style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
  Find
</button>
    </div>


    <script>  

function checkStatus() {
    const checkbox1 = document.getElementById('btncheck1'); //sad
    const checkbox2 = document.getElementById('btncheck2'); //anxious
    const checkbox3 = document.getElementById('btncheck3'); //worried
    const checkbox4 = document.getElementById('btncheck4'); //angry
    const checkbox5 = document.getElementById('btncheck5'); //excited
    const checkbox6 = document.getElementById('btncheck6'); //happy
    const checkbox7 = document.getElementById('btncheck7'); //proud
    const checkbox8 = document.getElementById('btncheck8'); //calm

    if (checkbox1.checked) { //sad
        if ((checkbox2.checked || checkbox3.checked) && !checkbox4.checked) {
            window.open("emotion1.html"); //sad, anxious and worried
        } else if ((checkbox2.checked || checkbox3.checked) && checkbox4.checked) {
            window.open("emotion3.html"); // anxious, sad, angry
        } else {
            window.open("emotion2.html"); // sad, angry
        }
    } else if (checkbox7.checked || checkbox6.checked) { //happy or proud
        if (checkbox8.checked) {
            window.open("emotion4.html"); // calm
        } else {
            window.open("emotion5.html"); // happy
        }
    }
}

document.getElementById('enter_btn').addEventListener('click', checkStatus);

document.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        checkStatus();
    }
});

</script>




    </section>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
